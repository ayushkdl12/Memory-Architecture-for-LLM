<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Graph Explorer</title>
    <!-- Cytoscape.js -->
    <script src="https://unpkg.com/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

    <!-- =====================================================
         SIDEBAR
    ====================================================== -->
    <aside class="sidebar">
        <div class="logo">Knowledge<span>Graph</span></div>

        <div class="section">
            <div class="section-title">Search</div>
            <input type="text" id="search" class="search-box"
                   placeholder="Search entities...">
        </div>

        <div class="section">
            <div class="section-title">Entity Types</div>
            <div id="typeFilters"></div>
        </div>

        <div class="section">
            <div class="section-title">Statistics</div>
            <div id="stats">Nodes: 0<br>Relationships: 0</div>
        </div>
    </aside>

    <!-- =====================================================
         MAIN GRAPH
    ====================================================== -->
    <main class="main">

        <div class="topbar">
            <div class="title">Interactive Knowledge Graph</div>
            <div class="controls">
                <button class="control-btn" onclick="zoomIn()">+</button>
                <button class="control-btn" onclick="zoomOut()">−</button>
                <button class="control-btn" onclick="fitGraph()">Fit</button>
                <button class="control-btn" onclick="resetGraph()">Reset</button>
            </div>
        </div>

        <div id="cy"></div>

        <!-- =====================================================
             LEGEND
        ====================================================== -->
        <div class="legend" id="legend"></div>

        <!-- =====================================================
             INFORMATION PANEL
        ====================================================== -->
        <div class="info-panel" id="infoPanel">
            <h2 id="infoTitle">Entity</h2>
            <div class="info-row">
                <div class="label">Type</div>
                <div id="infoType">-</div>
            </div>
            <div class="info-row" id="infoStatusRow" style="display:none">
                <div class="label">Status</div>
                <div id="infoStatus">-</div>
            </div>
            <div class="info-row">
                <div class="label">Description</div>
                <div id="infoDescription">-</div>
            </div>
            <div class="info-row">
                <div class="label">Connections</div>
                <div id="infoConnections">-</div>
            </div>
        </div>

    </main>
</div>

<!-- data (generated from db/seed_data.json) + app scripts -->
<script src="js/data.js"></script>
<script src="js/graph.js"></script>
<script src="js/search.js"></script>
<script src="js/app.js"></script>
</body>
</html>
